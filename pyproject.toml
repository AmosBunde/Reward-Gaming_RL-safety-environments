[project]
name = "rewardgaming"
version = "0.1.0"
description = "Small, fast RL environments whose grader can be gamed, with exact detection of gaming and a held-out-exploit generalisation test."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rewardgaming = "rewardgaming.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rewardgaming"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CPU-only PyTorch: every experiment here is sized for a desktop without a GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
